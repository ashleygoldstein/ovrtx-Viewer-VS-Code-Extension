<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OVRTX Viewer</title><link rel="stylesheet" href="viewer.css"></head>
<body>
<header><span class="brand"><span class="dot"></span>OVRTX Viewer</span><span id="name" title="Scene filename">USD scene</span><span class="badge">RTX</span></header>
<main>
  <div class="toolbar" aria-label="Camera controls">
    <button id="reset" title="Frame the entire scene (F)">Frame all <kbd>F</kbd></button>
    <button id="top">Top</button><button id="front">Front</button><button id="perspective">Perspective</button>
    <span class="spacer"></span><button id="retry" hidden>Retry</button>
  </div>
  <section class="viewport" aria-label="USD scene viewport" aria-busy="true">
    <img id="frame" tabindex="0" draggable="false" alt="USD scene rendered by OVRTX" aria-describedby="camera-help">
  </section>
  <p id="camera-help">Drag to orbit <span>·</span> Shift-drag to pan <span>·</span> Scroll to zoom <span>·</span> F to frame all</p>
</main>
<footer><span id="status" role="status">Loading scene…</span><span id="units"></span></footer>
<script src="viewer.js"></script>
</body></html>
